<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172d30">
  <title>かめ絵巻 — 月へつづく十の道</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="console">
    <header><a href="#" id="home">かめ絵巻 <small>月へつづく十の道</small></a><div><button id="sound" aria-label="効果音切り替え">音 OFF</button><button id="pause" aria-label="一時停止">休止</button><button id="fullscreen" aria-label="全画面">全画面</button></div></header>
    <section class="screen" aria-label="ゲーム画面">
      <canvas id="game" width="960" height="540" aria-label="和風横スクロールアクションゲーム"></canvas>
      <div id="hud"><span id="stage"></span><span id="form"></span><span id="score"></span></div>
      <div id="message" role="status" aria-live="polite"></div>
      <div id="overlay"></div>
    </section>
    <section class="gamepad" aria-label="仮想ゲームパッド">
      <div class="left-pad"><button class="shoulder" data-key="l">L <small>プロペラ</small></button><div class="dpad"><button class="up" data-key="up" aria-label="上">▲</button><button class="left" data-key="left" aria-label="左">◀</button><span></span><button class="right" data-key="right" aria-label="右">▶</button><button class="down" data-key="down" aria-label="下">▼</button></div></div>
      <div class="pad-center"><span class="crest">亀</span><small>和風冒険活劇</small><button id="help">操作・心得</button></div>
      <div class="right-pad"><button class="shoulder" data-key="r">R <small>スピン</small></button><div class="abxy"><button class="x" data-key="x" aria-label="乗る・降りる">X</button><button class="y" data-key="y" aria-label="ダッシュ・攻撃・持つ">Y</button><button class="a" data-key="a" aria-label="ジャンプ A">A</button><button class="b" data-key="b" aria-label="ジャンプ B">B</button></div></div>
    </section>
    <footer>左右：移動　B：跳ぶ　Y：走る・術・持つ　R：回転　L：飛行　X：乗降</footer>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
